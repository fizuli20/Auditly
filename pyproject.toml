[project]
name = "auditly"
version = "0.1.0"
description = "Local-first audit document question answering with page-level evidence."
requires-python = ">=3.10,<3.13"
dependencies = [
    "streamlit>=1.36",
    "pdfplumber>=0.11",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
]

[tool.ruff]
line-length = 100
